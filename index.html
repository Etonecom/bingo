<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BINGOan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F4EF; --surface:#FFFFFF; --surface2:#E3EAE2; --ink:#15231B; --muted:#5C6B62; --line:#D1DBD0;
  --green:#0E6B3D; --green-ink:#FFFFFF; --gold:#E4A11B; --gold-ink:#2A1D00; --red:#C5352B;
  --ok-bg:#E1F2E7; --bad-bg:#F9DEDA; --warn-bg:#FBEBD0;
  --accent:#0E6B3D; --accent-ink:#FFFFFF;
  --font:'Noto Sans Ethiopic','Abyssinica SIL','Nyala',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101914; --surface:#18241D; --surface2:#22322A; --ink:#ECF2ED; --muted:#98A89E; --line:#2E4036;
    --green:#3BB472; --green-ink:#052013; --gold:#F0B434; --gold-ink:#241800; --red:#EE6C5F;
    --ok-bg:#183524; --bad-bg:#3D1E1B; --warn-bg:#3B2E14;
    --accent:#3BB472; --accent-ink:#052013;
  }
}
/* የአጫዋች ገጾች በቀይ ተለይተው ይታያሉ፤ የተጫዋች ገጾች በአረንጓዴ (ነባሪ) */
body[data-role="caller"]{ --accent:#C5352B; --accent-ink:#FFFFFF; }
@media (prefers-color-scheme: dark){
  body[data-role="caller"]{ --accent:#EE6C5F; --accent-ink:#2B0804; }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
p{margin:.3rem 0}
h1,h2{margin:0}
.muted{color:var(--muted);font-size:14px}

/* ኳስ */
.ball{width:112px;height:112px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;
  border:6px solid var(--surface);box-shadow:0 0 0 3px var(--gold);font-size:58px;font-weight:800;line-height:1;flex:none}
.ball.sm{width:80px;height:80px;border-width:4px;font-size:42px}

/* የመክፈቻ ገጽ */
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);opacity:1;transition:opacity .5s ease}
.splash.hide{opacity:0;pointer-events:none}
.splash .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.splash h1{font-size:40px;font-weight:800}
.splash .dev{font-size:15px;color:var(--muted);font-weight:600}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: no-preference){.splash .ball{animation:rise .7s ease both}.splash .dev{animation:rise .7s ease .5s both}}
@media (prefers-reduced-motion: reduce){.splash{transition:none}}

main{max-width:480px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0 8px;text-align:center}
.hero h1{font-size:32px;font-weight:800}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-size:18px;font-weight:800;margin-bottom:6px}
.panel.ok{background:var(--ok-bg);border-color:var(--green)}
.panel.warn{background:var(--warn-bg);border-color:var(--gold)}
.namelist{margin:6px 0 0;font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 18px;min-height:56px;font-weight:800;font-size:18px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.alt{background:var(--surface2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600;font-size:15px;min-height:44px}
.btn.danger{background:var(--bad-bg);color:var(--red)}
.btn.small{width:auto;min-height:36px;padding:6px 12px;font-size:13px;border-radius:9px}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--surface);color:var(--ink);font-size:18px}
input.code{text-align:center;letter-spacing:.35em;font-weight:800;font-size:28px}
.err{background:var(--bad-bg);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:600}
.ok{background:var(--ok-bg);border-radius:10px;padding:10px 12px}
.roomcode{font-size:64px;font-weight:800;letter-spacing:.18em;text-align:center;line-height:1.2;padding-inline-start:.18em}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;background:var(--ok-bg);color:var(--accent);border-radius:99px;padding:2px 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;min-height:48px;font-weight:700;text-align:center}
.opt.on{border-color:var(--accent);background:var(--ok-bg)}
.shapebtn{display:block;width:100%;text-align:start;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:52px;margin-top:8px}
.shapebtn b{display:block;font-size:15px}
.shapebtn span{font-size:13px;color:var(--muted)}
.shapebtn.on{border-color:var(--accent);background:var(--ok-bg)}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.pick button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.pick button.mine{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick button.taken{background:var(--surface2);color:var(--muted);border-style:dashed}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.stat3 div{background:var(--surface2);border-radius:10px;padding:8px 6px;text-align:center}
.stat3 small{display:block;color:var(--muted);font-size:11px}
.stat3 b{font-size:16px}
.dev-foot{margin-top:auto;text-align:center;color:var(--muted);font-size:13px;padding-top:18px}
.callball{width:96px;height:96px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;border:5px solid var(--surface);box-shadow:0 0 0 3px var(--gold);line-height:1;flex:none}
.callball .l{font-size:18px;font-weight:800}
.callball .n{font-size:38px;font-weight:800}
.callball.empty{background:var(--surface2);box-shadow:0 0 0 3px var(--line);color:var(--muted)}
.ballrow{display:flex;align-items:center;gap:14px}
  .call-bingo-row{
  display:flex;
  align-items:center;
  gap:14px;
}
.call-bingo-row .callball{
  width:72px;
  height:72px;
  flex:none;
}
.call-bingo-row .callball .l{font-size:14px}
.call-bingo-row .callball .n{font-size:28px}
.call-bingo-row .bingobtn{
  flex:1;
  min-height:72px;
  font-size:20px;
  border-radius:16px;
  margin:0;
}
.board{display:grid;grid-template-columns:16px repeat(15,1fr);gap:2px;font-size:10px;margin-top:10px}
.board .l{font-weight:800;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px}
.board .c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--surface2);color:var(--muted)}
.board .c.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.board .c.last{background:var(--gold);color:var(--gold-ink);font-weight:800}
.cardgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:6px}
.cardgrid .h{text-align:center;font-weight:800;color:var(--accent);font-size:12px}
.cardgrid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:6px;font-weight:700;font-size:12px;padding:0}
.cardgrid button.m{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cardgrid button.free{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-size:9px}
.cardbox{position:relative}
.cardbox.out .cardgrid{opacity:.35}
.cardbox .stamp{position:absolute;inset:34px 0 0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cardbox .stamp span{background:var(--red);color:#fff;font-weight:800;padding:5px 12px;border-radius:8px;transform:rotate(-6deg)}
.bingobtn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:18px;margin:0}
.cdbox{display:flex;align-items:center;gap:10px}
.cdnum{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 28px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;text-align:center}
.toast.show{opacity:1;pointer-events:auto;cursor:pointer}

.offline-name{color:#c5352b!important}.request{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.small{padding:8px 10px!important;font-size:13px!important}.request-list .panel{margin-top:8px}
</style>

<style id="bingoProUI">
:root{--pro-primary:#1769ff;--pro-bg:#f5f7fb;--pro-card:#fff;--pro-text:#172033;--pro-muted:#7b8496;--pro-line:rgba(23,32,51,.09)}
body{background:var(--pro-bg)}

.pro-head{max-width:720px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between}

.pro-name{font-weight:900;font-size:18px}.pro-id{font-size:11px;color:var(--pro-muted);margin-top:3px}
.pro-title{font-size:16px;font-weight:900;margin-bottom:12px}.pro-muted{color:var(--pro-muted);font-size:12px}
.pro-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--pro-line)}.pro-row:last-child{border-bottom:0}
.pro-balance{font-size:31px;font-weight:950}.pro-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pro-btn{border:0;border-radius:14px;padding:12px;font-weight:850;cursor:pointer;background:#edf2f9;color:var(--pro-text)}.pro-btn.primary{background:var(--pro-primary);color:#fff}
.pro-list{display:grid;gap:8px}.pro-item{padding:12px;border:1px solid var(--pro-line);border-radius:14px}.pro-item small{color:var(--pro-muted)}
.pro-empty{text-align:center;padding:28px 8px;color:var(--pro-muted);font-size:13px}
.pro-colors{display:flex;gap:9px;flex-wrap:wrap}.pro-color{width:30px;height:30px;border-radius:50%;border:3px solid var(--pro-card);box-shadow:0 0 0 1px #cbd3df;cursor:pointer}.pro-color.sel{box-shadow:0 0 0 2px var(--pro-primary)}
.pro-switch{width:48px;height:28px;border-radius:20px;background:#d9dfeb;padding:3px;cursor:pointer}.pro-switch i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.pro-switch.on{background:var(--pro-primary)}.pro-switch.on i{transform:translateX(20px)}
@media(max-width:420px){#proPanel{padding-left:10px;padding-right:10px}}
.dark-ui .pro-btn{background:#273141;color:#eef3fb}

.btn{min-height:54px;border-radius:16px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#111827));box-shadow:0 10px 22px color-mix(in srgb,var(--accent) 24%,transparent);transition:transform .16s,box-shadow .16s,filter .16s}.btn:hover{filter:brightness(1.04);box-shadow:0 13px 28px color-mix(in srgb,var(--accent) 30%,transparent)}.btn:active{transform:translateY(2px) scale(.99)}.btn.alt{background:var(--surface2);box-shadow:none}.btn.ghost{color:var(--muted);box-shadow:none}

function isMarked(card, r, c, set){ const v = card[r][c]; return v === 0 || set.has(v); }
function lineCounts(card, set){
  let rows = 0, cols = 0;
  for (let i = 0; i < 5; i++){
    let rw = true, cl = true;
    for (let j = 0; j < 5; j++){
      if (!isMarked(card, i, j, set)) rw = false;
      if (!isMarked(card, j, i, set)) cl = false;
    }
    if (rw) rows++;
    if (cl) cols++;
  }
  return { rows, cols };
}
function allWhere(card, set, fn){
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++){ if (fn(r, c) && !isMarked(card, r, c, set)) return false; }
  return true;
}
function shapeDone(card, shape, set){
  const lc = lineCounts(card, set);
  switch (shape){
    case 'line': return lc.rows + lc.cols >= 1;
    case 'two': return lc.rows + lc.cols >= 2;
    case 'twoV': return lc.cols >= 2;
    case 'twoH': return lc.rows >= 2;
    case 'x': return allWhere(card, set, (r, c) => r === c || r + c === 4);
    case 'square': return allWhere(card, set, (r, c) => r === 0 || r === 4 || c === 0 || c === 4);
    case 'full': return allWhere(card, set, () => true);
  }
  return false;
}
function winsOnLast(card, shape, calledArr){
  if (!calledArr.length) return false;
  if (!shapeDone(card, shape, new Set(calledArr))) return false;
  return !shapeDone(card, shape, new Set(calledArr.slice(0, -1)));
}

async function enterExistingRoom(code, owner){

async function restore(){
  const role = ls.get('bingo_role'), room = ls.get('bingo_room');
  if (role === 'caller') {
    S.isCaller = await checkCaller();
    if (!S.isCaller) { ls.del('bingo_room'); S.screen = 'callerCode'; return; }
    await ensureCallerWallet();
    if (room && await enterExistingRoom(room, true)) { setupPresence(room); return; }
    S.screen = 'callerHome';

function myPlayer(){ return S.players[S.uid] || null; }
function cacheKey(room,pid){ return 'bingo_balance_'+room+'_'+pid; }
function cacheBalance(room,pid,bal){ if(room&&pid&&Number.isFinite(+bal)) ls.set(cacheKey(room,pid),String(+bal)); }
function cachedBalance(room,pid){ const v=ls.get(cacheKey(room,pid)); return v==null?null:(+v||0); }
function historyKey(room){ return 'bingo_game_history_'+String(room||''); }
function loadGameHistory(room){
  try {
    const raw=ls.get(historyKey(room));
    const h=raw?JSON.parse(raw):[];
    return Array.isArray(h)?h:[];
  } catch(e){ return []; }
}
function saveGameHistory(room,h){ try { ls.set(historyKey(room),JSON.stringify(h.slice(-100))); } catch(e) {} }
function clearGameHistory(room){ if(room) ls.del(historyKey(room)); }
function recordGameHistory(round){
  if(!S.room || !round || round.status!=='done' || !round.result) return;
  const id=String(round.openedAt||round.startedAt||'');
  if(!id) return;
  if(S.history.some(x=>x && x.id===id)) return;
  const winners=Array.isArray(round.result.winners)?round.result.winners.map(w=>({card:w.card,uid:w.uid,name:playerName(w.uid)})):[];
  const entry={id,shape:round.shape,shapeName:shapeOf(round.shape).name,fee:+round.fee||0,noWinner:!!round.result.noWinner,reason:round.result.reason||'',winners};
  S.history=[...S.history,entry].slice(-100);
  saveGameHistory(S.room,S.history);
}
function requestId(){ return S.uid+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

 const q=S.joinRequests[rid]; if(!q||!S.room)return; const base=`rooms/${S.room}`;
 try{

  const oldSnap=await get(ref(db,`${base}/players/${q.oldUid}`)); const old=oldSnap.exists()?oldSnap.val():{name:q.name,playerId:q.playerId,balance:0};
  const updates={};

 }catch(e){toast('የመግቢያ ፍቃድ አልተሳካም።');}

async function requestCoin(kind, suppliedAmount){
 const p=myPlayer(); if(!S.room||!p)return;
 const pending=Object.values(S.coinRequests||{}).some(q=>q&&q.uid===S.uid&&q.status==='pending');
 if(pending){toast('ቀድሞ የተላከ Coin Request አለህ። መጀመሪያ ውሳኔውን ጠብቅ።');return;}
 const raw=suppliedAmount==null?prompt(kind==='deposit'?'ለተጨማሪ ኮይን የምትፈልገውን መጠን ጻፍ፦':'ለማውጣት የምትፈልገውን ኮይን መጠን ጻፍ፦','100'):suppliedAmount;
 const amount=+raw;
 if(!Number.isInteger(amount)||amount<=0){toast('ትክክለኛ የኮይን መጠን ጻፍ።');return;}
 if(kind==='withdraw'&&amount>(+p.balance||0)){toast('ያለህ ኮይን በቂ አይደለም።');return;}
 const rid=requestId();
 try{

  toast(kind==='deposit'?'የኮይን ገቢ ጥያቄህ ተልኳል።':'የኮይን ወጪ ጥያቄህ ተልኳል።');
 }catch(e){toast('የኮይን ጥያቄውን መላክ አልተቻለም።');}
}
async function cancelCoin(rid){

  if(!q || q.uid!==S.uid || q.status!=='pending' || !S.room) return;
  try {

async function decideCoin(rid,approve){
  const q=S.coinRequests[rid]; if(!q||!S.room||q.status!=='pending'||!S.isCaller)return;
  const base=`rooms/${S.room}`;
  try{
    if(!approve){
      await update(ref(db),{
        [`${base}/coinRequests/${rid}/status`]:'rejected',
        [`${base}/coinRequests/${rid}/decidedAt`]:serverTimestamp(),
        [`${base}/coinTransactions/${rid}`]:{type:q.kind==='deposit'?'Income':'Expense',amount:+q.amount||0,status:'Rejected',requestId:rid,uid:q.uid,playerName:q.name||'Player',playerId:q.playerId||'',actorRole:'Caller'}
      });
      toast('የኮይን ጥያቄው ውድቅ ተደርጓል።');
      return;
    }
    const ps=await get(ref(db,`${base}/players/${q.uid}`));
    if(!ps.exists()) return;
    const p=ps.val(), old=+p.balance||0, amount=+q.amount||0;
    if(q.kind==='withdraw'&&old<amount){
      await update(ref(db),{
        [`${base}/coinRequests/${rid}/status`]:'rejected',
        [`${base}/coinRequests/${rid}/reason`]:'insufficient-balance',
        [`${base}/coinRequests/${rid}/decidedAt`]:serverTimestamp(),
        [`${base}/coinTransactions/${rid}`]:{type:'Expense',amount,status:'Rejected',requestId:rid,uid:q.uid,playerName:q.name||'Player',playerId:q.playerId||'',actorRole:'Caller'}
      });
      toast('የተጫዋቹ ቀሪ ሒሳብ አነስተኛ ነው። ወጪ አልተፈጸመም።');
      return;
    }
    const next=q.kind==='deposit'?old+amount:old-amount;
    const type=q.kind==='deposit'?'Income':'Expense';

    // Caller is the room owner, so use only the existing rule-authorized paths.
    // Stage 1 intentionally does not use an extra coinApprovals path.
    await update(ref(db),{
      [`${base}/coinTransactions/${rid}`]:{type,amount,status:'Approved',requestId:rid,uid:q.uid,playerName:q.name||'Player',playerId:q.playerId||'',actorRole:'Caller'},
      [`${base}/players/${q.uid}/balance`]:next,
      [`${base}/coinRequests/${rid}/status`]:'approved',
      [`${base}/coinRequests/${rid}/decidedAt`]:serverTimestamp()
    });
    toast('የኮይን ጥያቄው ጸድቋል።');
  }catch(e){
    toast('የኮይን ጥያቄውን ማስፈጸም አልተቻለም።');
  }
}

let lastRoundStatus;
let knownPendingCoinIds = new Set();
let coinRequestNoticeReady = false;
let lastRoundNote = null;
let noticeQueue = [];
let noticeShowing = false;
function showNoticeQueue(){
  if(noticeShowing || !noticeQueue.length) return;
  noticeShowing = true;
  const msg = noticeQueue.shift();
  const t = $('toast');
  if(!t){ noticeShowing=false; return; }
  t.textContent = msg;
  t.dataset.openCoins = (S.isCaller && msg.indexOf('💰 New Coin Request') === 0) ? '1' : '';
  t.classList.add('show');
  clearTimeout(showNoticeQueue._t);
  showNoticeQueue._t = setTimeout(()=>{
    t.classList.remove('show');
    noticeShowing=false;
    setTimeout(showNoticeQueue,220);
  },3200);
}
function queueRoundNotices(note){
  if(!note) return;
  String(note).split(' · ').map(x=>x.trim()).filter(Boolean).forEach(x=>noticeQueue.push(x));
  showNoticeQueue();
}
function subscribeRoom(code){
  unsubscribeAll();
  lastRoundStatus = undefined;
  lastRoundNote = null;
  noticeQueue = [];
  noticeShowing = false;
  S.history = loadGameHistory(code);
  knownPendingCoinIds = new Set();
  coinRequestNoticeReady = false;
  if(S.isCaller){
    unsubs.push(onValue(ref(db,`callerWallets/${S.uid}`), snap=>{ S.callerWallet=snap.val()||{balance:0}; render(); }));
    unsubs.push(onValue(ref(db,`callerTransactions/${S.uid}`), snap=>{ S.callerTransactions=snap.val()||{}; render(); }));
  }
  unsubs.push(onValue(ref(db, `rooms/${code}/meta`), (snap) => {
    if (!snap.exists()) { roomGone(); return; }
    S.meta = snap.val();
    render();
  }));
  unsubs.push(onValue(ref(db, `rooms/${code}/players`), (snap) => {
    S.players = snap.val() || {};
    const me=S.players[S.uid];
    if(me && me.playerId && me.balance!=null){S.currentPlayerId=me.playerId;cacheBalance(code,me.playerId,+me.balance);}
    render();
  }));
  unsubs.push(onValue(S.isCaller ? ref(db, `rooms/${code}/joinRequests`) : query(ref(db, `rooms/${code}/joinRequests`), orderByChild('newUid'), equalTo(S.uid)), snap=>{
    S.joinRequests=snap.val()||{};
    const pending=S.pendingJoin?S.joinRequests[S.pendingJoin]:null;
    if(!S.isCaller && pending?.status==='approved'){
      S.currentPlayerId=pending.playerId||S.currentPlayerId;
      S.screen='lobbyPlayer';
      setupPresence(code);
    }
    render();
  }));
  unsubs.push(onValue(S.isCaller ? ref(db, `rooms/${code}/coinRequests`) : query(ref(db, `rooms/${code}/coinRequests`), orderByChild('uid'), equalTo(S.uid)), snap=>{
    S.coinRequests=snap.val()||{};
    if(S.isCaller){
      const pendingIds=new Set(Object.values(S.coinRequests).filter(q=>q&&q.status==='pending'&&q.requestId).map(q=>q.requestId));
      if(coinRequestNoticeReady){
        for(const id of pendingIds){
          if(!knownPendingCoinIds.has(id)){
            const q = S.coinRequests[id];
            const kindText = q && q.kind === 'deposit' ? 'Income' : 'Expense';
            const sign = q && q.kind === 'deposit' ? '+' : '-';
            const amount = q && Number.isFinite(+q.amount) ? (+q.amount) : 0;
            noticeQueue.push('💰 New Coin Request · ' + (q?.name || 'Player') + ' · ' + kindText + ' ' + sign + '$' + amount + ' · Tap to review');
            showNoticeQueue();
            break;
          }
        }
      }
      knownPendingCoinIds=pendingIds;
      coinRequestNoticeReady=true;
    }
    render();
  }));
  unsubs.push(onValue(S.isCaller ? ref(db, `rooms/${code}/coinTransactions`) : query(ref(db, `rooms/${code}/coinTransactions`), orderByChild('playerId'), equalTo(S.currentPlayerId)), snap=>{S.coinTransactions=snap.val()||{};render();}));
  unsubs.push(onValue(ref(db, `rooms/${code}/round`), (snap) => {
    const existed = snap.exists();
    const newStatus = existed ? snap.val().status : null;
    if (!S.isCaller && ['running', 'claim', 'joining'].indexOf(lastRoundStatus) !== -1 && !existed) {
      toast('አጫዋቹ ዙሩን አቁሟል');
    }
    lastRoundStatus = newStatus;
    S.round = existed ? snap.val() : null;
    const roundNote = S.round && S.round.note ? String(S.round.note) : null;
    if(!S.isCaller && coinRequestNoticeReady && roundNote && roundNote !== lastRoundNote){
      queueRoundNotices(roundNote);
    }
    lastRoundNote = roundNote;
    recordGameHistory(S.round);
    render();
  }));
  unsubs.push(onValue(ref(db, `rooms/${code}/cards`), (snap) => {
    S.cards = snap.val() || {};
    render();
  }));
  unsubs.push(onValue(ref(db, `rooms/${code}/claims`), (snap) => {
    S.claims = snap.val() || {};
    onClaimsChanged();
    render();
  }));
}

async function refundJoiningCards(){
  if(!S.room) return;
  const cards = Object.entries(S.cards || {}).filter(([,uid])=>uid);
  for(const [card,uid] of cards){
    const ps = await get(ref(db,`rooms/${S.room}/players/${uid}`));
    if(!ps.exists()) continue;
    const p = ps.val();
    const oldBalance = +p.balance || 0;
    const fee = +(S.round?.fee || 0);
    if(fee <= 0) continue;
    const opId = requestId() + '_refund';
    const base = `rooms/${S.room}`;
    await set(ref(db,`${base}/gameOps/${uid}`),{action:'refund',card:String(card),fee,oldBalance,newBalance:oldBalance+fee,status:'ready',opId});
    try{
      await update(ref(db),{
        [`${base}/cards/${card}`]:null,
        [`${base}/players/${uid}/balance`]:oldBalance+fee,
        [`${base}/coinTransactions/${opId}`]:{uid,playerId:p.playerId||'',playerName:p.name||'Player',amount:fee,type:'Income',status:'Approved',source:'Card refund',opId}
      });
      await runTransaction(ref(db,`${base}/round`), r => {
        if(!r || r.status !== 'joining') return;
        const total = Math.max(0,(+r.totalCollected||0)-fee);
        return {...r,totalCollected:total,callerFee:total*0.10,prizePool:total*0.90};
      });
    }finally{
      await remove(ref(db,`${base}/gameOps/${uid}`)).catch(()=>{});
    }
  }
}

async function pickCard(no){
  if (!S.room || !S.round || S.round.status !== 'joining') return;
  const owner = S.cards[no];
  const me = S.players[S.uid] || {};
  const balance = +me.balance || 0;
  const fee = +S.round.fee || 0;
  const base = `rooms/${S.room}`;
  const opId = requestId();
  try {
    if (owner === S.uid) {
      await set(ref(db,`${base}/gameOps/${S.uid}`),{action:'refund',card:String(no),fee,oldBalance:balance,newBalance:balance+fee,status:'ready',opId});
      try {
        await update(ref(db), {
          [`${base}/cards/${no}`]: null,
          [`${base}/players/${S.uid}/balance`]: balance + fee
        });
        await runTransaction(ref(db,`${base}/round`), r=>{
          if(!r || r.status!=='joining') return;
          const total=Math.max(0,(+r.totalCollected||0)-fee);
          return {...r,totalCollected:total,callerFee:total*0.10,prizePool:total*0.90};
        });
      } finally {
        await remove(ref(db,`${base}/gameOps/${S.uid}`)).catch(()=>{});
      }
    } else if (!owner) {
      if (balance < fee) { toast('ያለህ ኮይን በቂ አይደለም። ያለህ፦ ' + balance + '፣ የሚያስፈልገው፦ ' + fee + '።'); return; }
      await set(ref(db,`${base}/gameOps/${S.uid}`),{action:'buy',card:String(no),fee,oldBalance:balance,newBalance:balance-fee,status:'ready',opId});
      try {
        await update(ref(db), {
          [`${base}/cards/${no}`]: S.uid,
          [`${base}/players/${S.uid}/balance`]: balance - fee
        });
        await runTransaction(ref(db,`${base}/round`), r=>{
          if(!r || r.status!=='joining') return;
          const total=(+r.totalCollected||0)+fee;
          return {...r,totalCollected:total,callerFee:total*0.10,prizePool:total*0.90};
        });
      } finally {
        await remove(ref(db,`${base}/gameOps/${S.uid}`)).catch(()=>{});
      }
    }
  } catch (err) { toast('አልተቻለም፦ ' + (err.code || err.message)); }
}


/* ---------- የካውንተር ጨዋታ ሞተር (አጫዋቹ ብቻ) ---------- */
let drawTimer = null, resolveTimer = null, endTimer = null;
function stopCallerTimers(){ clearTimeout(drawTimer); clearTimeout(resolveTimer); clearTimeout(endTimer); drawTimer = resolveTimer = endTimer = null; }
async function startCalling(){
  if (!S.room || !Object.keys(S.cards).length) { if (!Object.keys(S.cards).length) toast('ቢያንስ አንድ ካርቴላ መያዝ አለበት'); return; }
  stopCallerTimers();
  try {
    await update(ref(db, `rooms/${S.room}/round`), { status: 'running', called: [], out: {}, result: null, claimDeadline: null, startedAt: serverTimestamp() });
  } catch (err) { toast('መጀመር አልተቻለም፦ ' + (err.code || err.message)); return; }
  scheduleDraw(1200);
}
function scheduleDraw(ms){ clearTimeout(drawTimer); drawTimer = setTimeout(drawNext, ms); }
async function drawNext(){
  if (!S.isCaller || !S.round || S.round.status !== 'running') return;
  const called = S.round.called || [];
  if (called.length >= 75) return;
  let n;
  do { n = 1 + Math.floor(Math.random() * 75); } while (called.indexOf(n) !== -1);
  const nextCalled = called.concat([n]);
  try { await update(ref(db, `rooms/${S.room}/round`), { called: nextCalled }); } catch (err) { toast('ስህተት፦ ' + (err.code || err.message)); return; }
  if (nextCalled.length >= 75) {
    clearTimeout(endTimer);
    endTimer = setTimeout(() => { if (S.round && S.round.status === 'running') finalizeNoWinner(); }, WINDOW_MS + 1000);
  } else {
    scheduleDraw(CALL_MS);
  }
}
async function settleRound(){
  if(!S.isCaller || !S.room) return;
  const roundRef=ref(db,`rooms/${S.room}/round`);
  const gate=await runTransaction(roundRef,r=>{
    if(!r || r.status!=='done' || r.payoutStatus==='settled' || r.payoutStatus==='processing') return;
    return {...r,payoutStatus:'processing',payoutId:requestId()};
  });
  if(!gate.committed) return;
  const r=gate.snapshot.val(), payoutId=r.payoutId, total=Math.max(0,Math.floor(+r.totalCollected||0));
  const winners=(!r.result?.noWinner && Array.isArray(r.result?.winners)) ? r.result.winners : [];
  const callerAmount=winners.length ? Math.floor(total*0.10) : total;
  const prizeAmount=winners.length ? total-callerAmount : 0;
  try{
    const cw=await get(ref(db,`callerWallets/${S.uid}`));
    const callerWallet=cw.exists()?cw.val():{balance:0};
    const updates={};
    if(callerAmount>0){
      updates[`callerWallets/${S.uid}/balance`]=(+callerWallet.balance||0)+callerAmount;
      updates[`callerTransactions/${S.uid}/${payoutId}`]={type:'Income',amount:callerAmount,status:'Approved',source:winners.length?'Caller fee':'No-winner round',roomId:S.room,roundId:payoutId,at:serverTimestamp()};
    }
    const share=winners.length?Math.floor(prizeAmount/winners.length):0;
    let remainder=winners.length?prizeAmount-share*winners.length:0;
    for(let i=0;i<winners.length;i++){
      const w=winners[i], ps=await get(ref(db,`rooms/${S.room}/players/${w.uid}`));
      if(!ps.exists()) continue;
      const p=ps.val(), amount=share+(i===0?remainder:0);
      remainder=i===0?0:remainder;
      if(amount<=0) continue;
      updates[`rooms/${S.room}/players/${w.uid}/balance`]=(+p.balance||0)+amount;
      updates[`rooms/${S.room}/coinTransactions/${payoutId}_winner_${i}`]={uid:w.uid,playerId:p.playerId||'',playerName:p.name||'Player',type:'Income',amount,status:'Approved',source:'Bingo prize',payoutId,roomId:S.room,roundId:payoutId};
    }
    updates[`rooms/${S.room}/round/payoutStatus`]='settled';
    updates[`rooms/${S.room}/round/callerFee`]=callerAmount;
    updates[`rooms/${S.room}/round/prizePool`]=prizeAmount;
    updates[`rooms/${S.room}/round/settledAt`]=serverTimestamp();
    await update(ref(db),updates);
  }catch(e){
    await update(roundRef,{payoutStatus:'failed',payoutError:String(e.code||e.message||e)}).catch(()=>{});
    toast('የዙሩ የcoin ክፍፍል አልተሳካም።');
  }
}
async function finalizeNoWinner(){
  if (!S.room) return;
  try { await update(ref(db, `rooms/${S.room}/round`), { status: 'done', result: { noWinner: true, winners: [], reason: 'exhausted' }, payoutStatus:'pending' }); await settleRound(); } catch (err) {}
}
function onClaimsChanged(){
  if (!S.isCaller || !S.round) return;
  const ids = Object.keys(S.claims);
  if (S.round.status === 'running' && ids.length) {
    clearTimeout(drawTimer); clearTimeout(endTimer);
    const deadline = Date.now() + WINDOW_MS;
    update(ref(db, `rooms/${S.room}/round`), { status: 'claim', claimDeadline: deadline }).catch(() => {});
    resolveTimer = setTimeout(resolveClaims, WINDOW_MS);
  }
}
async function resolveClaims(){
  if (!S.isCaller || !S.room || !S.round) return;
  const called = S.round.called || [];
  const newOut = Object.assign({}, S.round.out || {});
  const winners = [];
  const notes = [];
  const nameOf = (uid) => (S.players[uid] && S.players[uid].name) || 'ተጫዋች';
  Object.keys(S.claims).forEach((cid) => {
    const c = S.claims[cid];
    const cardNo = +c.card;
    if (S.cards[cardNo] !== c.uid) return;          // ካርዱ የእሱ አይደለም (spoof) — ችላ በል
    if (newOut[cardNo]) return;                       // ቀድሞ ከዙሩ ወጥቷል
    if (winsOnLast(cardOf(cardNo), S.round.shape, called)) {
      winners.push({ card: cardNo, uid: c.uid });
      notes.push(nameOf(c.uid) + ' ካርቴላ #' + cardNo + ' በትክክል አሸንፏል!');
    } else {
      newOut[cardNo] = true;
      notes.push(nameOf(c.uid) + ' ካርቴላ #' + cardNo + ' ላይ ተሳስቶ BINGO ብሏል፤ ካርዱ ከዙሩ ወጥቷል።');
    }
  });
  const note = notes.length ? notes.join(' · ') : null;
  let updates;
  const allCardNos = Object.keys(S.cards).map(Number);
  const allOut = allCardNos.length > 0 && allCardNos.every((n) => newOut[n]);
  if (winners.length) updates = { status: 'done', out: newOut, result: { noWinner: false, winners }, claimDeadline: null, note: note, payoutStatus:'pending' };
  else if (allOut) updates = { status: 'done', out: newOut, result: { noWinner: true, winners: [], reason: 'allOut' }, claimDeadline: null, note: note, payoutStatus:'pending' };
  else if (called.length >= 75) updates = { status: 'done', out: newOut, result: { noWinner: true, winners: [], reason: 'exhausted' }, claimDeadline: null, note: note, payoutStatus:'pending' };
  else updates = { status: 'running', out: newOut, claimDeadline: null, note: note };
  try {
    await update(ref(db, `rooms/${S.room}/round`), updates);
    await remove(ref(db, `rooms/${S.room}/claims`));
    if(updates.status==='done' && updates.result?.reason!=='cancelled') await settleRound();
  } catch (err) { toast('ስህተት፦ ' + (err.code || err.message)); }
  if (updates.status === 'running') scheduleDraw(CALL_MS);
}
  
  /* ---------- BINGO ማለት (ተጫዋቹ) ---------- */
function myEligibleCards(){
  const mine = Object.keys(S.cards).filter((n) => S.cards[n] === S.uid).map(Number);
  const out = (S.round && S.round.out) || {};
  const claimedByMe = new Set(Object.values(S.claims).filter((c) => c.uid === S.uid).map((c) => +c.card));
  return mine.filter((n) => !out[n] && !claimedByMe.has(n));
}
async function claimCard(no){
  if (!S.room || !S.round) return;
  const inWindow = S.round.status === 'claim' && S.round.claimDeadline && Date.now() < S.round.claimDeadline;
  if (S.round.status !== 'running' && !inWindow) return;
  S.chooser = false;
  try { await set(ref(db, `rooms/${S.room}/claims/${S.uid}_${no}`), { uid: S.uid, card: no, at: serverTimestamp() }); }
  catch (err) { toast('አልተቻለም፦ ' + (err.code || err.message)); }
  render();
}
function tapBingo(){
  const elig = myEligibleCards();
  if (!elig.length) { toast('ለመመዝገብ የቀረ ካርቴላ የለህም'); return; }
  if (elig.length === 1) { claimCard(elig[0]); return; }
  S.chooser = !S.chooser; render();
}
function toggleMark(card, n){
  S.marks[card] = S.marks[card] || {};
  if (S.marks[card][n]) delete S.marks[card][n]; else S.marks[card][n] = 1;
  render();
}

function act(a, d){
  S.err = '';
  if (a === 'role-player') { ls.set('bingo_role', 'player'); S.screen = 'player'; }
  else if (a === 'role-caller') { startCaller(); return; }
  else if (a === 'back') { ls.del('bingo_role'); S.screen = 'role'; }
  else if (a === 'join') { joinRoom(); return; }
  else if (a === 'approvejoin') { approveJoin(d.id,true); return; }
  else if (a === 'rejectjoin') { approveJoin(d.id,false); return; }
  else if (a === 'approvecoin') { decideCoin(d.id,true); return; }
  else if (a === 'rejectcoin') { decideCoin(d.id,false); return; }
  else if (a === 'cancelcoin') { cancelCoin(d.id); return; }
  else if (a === 'redeem') { redeemCode(); return; }
  else if (a === 'openroom') { openRoom(); return; }
  else if (a === 'closeroom') { closeRoom(); return; }
  else if (a === 'leave') { leaveRoom(); return; }
  else if (a === 'shape') { S.roundForm.shape = d.v; }
  else if (a === 'fee') { S.roundForm.fee = +d.v; }
  else if (a === 'openround') { openRound(); return; }
  else if (a === 'resetround') { resetRound(); return; }
  else if (a === 'stopround') { stopRound(); return; }
  else if (a === 'pickcard') { pickCard(+d.n); return; }
  else if (a === 'startgame') { startCalling(); return; }
  else if (a === 'newround') { S.round && stopCallerTimers(); remove(ref(db, `rooms/${S.room}/round`)).catch(() => {}); return; }
  else if (a === 'mark') { toggleMark(d.card, +d.n); return; }
  else if (a === 'bingo') { tapBingo(); return; }
  else if (a === 'claimcard') { claimCard(+d.n); return; }
  render();
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  act(b.dataset.a, b.dataset);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t.dataset || !t.dataset.f) return;
  if (t.dataset.f === 'playerId') t.value=t.value.replace(/[^A-Za-z0-9_-]/g,'').slice(0,24);

  if (t.dataset.f === 'code') t.value = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 24);
  S.form[t.dataset.f] = t.value;
});

const errBox = () => S.err ? '<div class="err" role="alert">' + esc(S.err) + '</div>' : '';
function playerList(){
 const entries=Object.keys(S.players).map(id=>({id,p:S.players[id]})).sort((a,b)=>(a.p.joinedAt||0)-(b.p.joinedAt||0)); if(!entries.length)return '<p class="muted">እስካሁን ማንም አልገባም።</p>';

}
function joinRequestHTML(){const qs=Object.values(S.joinRequests).filter(q=>q.status==='pending');if(!qs.length)return '';return '<div class="panel warn" style="margin-top:10px"><h3>የመመለሻ ጥያቄ</h3>'+qs.map(q=>'<div class="request"><div><b>'+esc(q.name)+'</b><div class="muted">ID: '+esc(q.playerId)+'</div></div><div class="row"><button class="btn small" data-a="approvejoin" data-id="'+esc(q.requestId)+'">ፍቀድ</button><button class="btn danger small" data-a="rejectjoin" data-id="'+esc(q.requestId)+'">አትፍቀድ</button></div></div>').join('')+'</div>';}
function coinRequestHTML(){const qs=Object.values(S.coinRequests).filter(q=>q.status==='pending');if(!qs.length)return '';return '<div class="panel" style="margin-top:10px"><h3>የኮይን ጥያቄዎች</h3>'+qs.map(q=>'<div class="request"><div><b>'+esc(q.name)+'</b><div class="muted">'+(q.kind==='deposit'?'ገቢ':'ወጪ')+' · '+q.amount+' ኮይን</div></div><div class="row"><button class="btn small" data-a="approvecoin" data-id="'+esc(q.requestId)+'">ፍቀድ</button><button class="btn danger small" data-a="rejectcoin" data-id="'+esc(q.requestId)+'">ውድቅ</button></div></div>').join('')+'</div>';}

function boardHTML(called){
  const last = called.length ? called[called.length - 1] : -1;
  let h = '<div class="board" aria-label="የተጠሩ ቁጥሮች ሰሌዳ">';
  for (let L = 0; L < 5; L++) {
    h += '<div class="l">' + LETTERS[L] + '</div>';
    for (let i = 1; i <= 15; i++) {
      const n = L * 15 + i, on = called.indexOf(n) !== -1;
      h += '<div class="c' + (n === last ? ' last' : on ? ' on' : '') + '">' + n + '</div>';
    }
  }
  return h + '</div>';
}
function callBallHTML(called){
  if (!called.length) return '<div class="callball empty"><span class="n">—</span></div>';
  const n = called[called.length - 1];
  return '<div class="callball"><span class="l">' + letterOf(n) + '</span><span class="n">' + n + '</span></div>';
}
function cardBoxHTML(no){
  const g = cardOf(no), out = !!(S.round && S.round.out && S.round.out[no]), mk = S.marks[no] || {};
  const claimedByMe = Object.values(S.claims).some((c) => c.uid === S.uid && +c.card === no);
  let h = '<div class="cardbox' + (out ? ' out' : '') + '"><div class="panel"><b>ካርድ #' + no + '</b>' +
    (claimedByMe ? ' <span class="muted">BINGO ብለሃል…</span>' : '') + '<div class="cardgrid">';
  for (let c = 0; c < 5; c++) h += '<div class="h">' + LETTERS[c] + '</div>';
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const v = g[r][c];
    if (v === 0) h += '<button class="free" disabled>ነፃ</button>';
    else h += '<button class="' + (mk[v] ? 'm' : '') + '" data-a="mark" data-card="' + no + '" data-n="' + v + '"' + (out ? ' disabled' : '') + '>' + v + '</button>';
  }
  h += '</div></div>';
  if (out) h += '<div class="stamp"><span> የተሳሳተ ካርቴላ ! ለዚህ ዙር ታግዷል</span></div>';
  return h + '</div>';
}
function playerName(uid){ return (S.players[uid] && S.players[uid].name) || 'ተጫዋች'; }
function noteHTML(){
  if (!S.isCaller || !S.round || !S.round.note) return '';
  return '<div class="panel warn" style="margin-top:10px"><p>' + esc(S.round.note) + '</p></div>';
}
function resultHTML(result){
  if (!result) return '';
  if (result.noWinner) {
    const msgs = {
      cancelled: 'አጫዋቹ ይህን ዙር በእጅ አቁሞታል።',
      allOut: 'ማንም ትክክለኛ BINGO ስላላለ (የተያዙት ካርቴላዎች ሁሉ በስህተት BINGO በመባላቸው ከዙሩ ወጥተዋል) ዙሩ ተዘግቷል።',
      exhausted: '75ቱም ቁጥሮች ተጠርተዋል፤ በጊዜ ትክክለኛ BINGO ያለ አልነበረም።'
    };
    const outList = result.reason === 'allOut'
      ? '<p class="namelist">የወጡ ካርቴላዎች፦ ' + Object.keys(S.round.out || {}).map(Number).sort((a, b) => a - b)
          .map((n) => '#' + n + ' (' + esc(playerName(S.cards[n])) + ')').join('፣ ') + '</p>'
      : '';
    return '<div class="panel warn"><h2>ማንም አላሸነፈም</h2><p>' + (msgs[result.reason] || msgs.exhausted) + '</p>' + outList + '</div>';
  }
  const mine = result.winners.some((w) => w.uid === S.uid);
  return '<div class="panel ok"><h2>BINGO! ዙሩ አለቀ</h2><p>አሸናፊ ካርቴላዎች፦ ' +
    result.winners.map((w) => '#' + w.card + ' (' + esc(playerName(w.uid)) + ')' + (w.uid === S.uid ? ' — አንተ' : '')).join('፣ ') + '</p>' +
    (mine ? '<p style="font-weight:800;margin-top:4px">አሸንፈሃል! 🎉</p>' : '') + '</div>';
}
function cdLeft(){
  if (!S.round || !S.round.claimDeadline) return WINDOW_MS / 1000;
  
  return Math.max(0, Math.ceil((S.round.claimDeadline - Date.now()) / 1000));
}

          if (S.chooser) {
            mid += '<div class="panel"><b>የትኛው ካርቴላ?</b><div class="row" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
              elig.map((c) => '<button class="btn" data-a="claimcard" data-n="' + c + '">ካርድ #' + c + '</button>').join('') + '</div></div>';
          }
        } else if (!mineAll.length) {
          mid += '<div class="panel"><p class="muted">በዚህ ዙር ካርቴላ አልያዝክም፤ እየተመለከትክ ነው።</p></div>';
        }

        mid += mineAll.map(cardBoxHTML).join('');
    default:
      return '<div class="hero"><div class="ball sm" aria-hidden="true">B</div><p class="muted">እየተጫነ ነው…</p></div>';
  }
}

let proTab = 'profile';

function proInitial(name){
  const s = String(name || '?').trim();
  return s ? s.charAt(0).toUpperCase() : '?';
}
function proCoins(p){
  if(!p) return 0;
  return Number(p.balance ?? p.coins ?? p.coin ?? 0) || 0;
}
function proHistory(){
  const h = S.history || [];
  return Array.isArray(h) ? h : Object.values(h || {});
}
function proRequests(){
  const q = S.coinRequests || {};
  return Object.values(q || {});
}
function proPanelHtml(tab){
  const me = myPlayer ? myPlayer() : null;
  const name = me?.name || S.form?.name || 'Player';
  const pid = me?.playerId || S.form?.playerId || '—';
  const room = S.room || S.form?.room || '—';
  const balance = S.isCaller ? Number(S.callerWallet?.balance||0) : proCoins(me);
  const role = S.isCaller ? 'Caller' : 'Player';

  if(tab==='profile') return `
    <div class="pro-head"><div class="pro-brand">BINGO<span>an</span></div><div class="pro-room">Room ${esc(room)}</div></div>
    <div class="pro-wrap">
      <div class="pro-card"><div class="pro-profile">
        <div class="pro-avatar">${esc(proInitial(name))}</div>
        <div><div class="pro-name">${esc(name)}</div><div class="pro-id">ID: ${esc(pid)}</div><div class="pro-muted">${role}</div></div>
      </div></div>
      <div class="pro-card"><div class="pro-title">Account</div>
        <div class="pro-row"><span class="pro-muted">Available coins</span><b>${balance}</b></div>
        <div class="pro-row"><span class="pro-muted">Room</span><b>${esc(room)}</b></div>
        <div class="pro-row"><span class="pro-muted">Connection</span><b id="proConnection">${navigator.onLine?'Online':'Offline'}</b></div>
      </div>
      <div class="pro-card"><div class="pro-title">Appearance</div>
        <div class="pro-row"><span>Dark mode</span><div id="proDark" class="pro-switch ${document.body.classList.contains('dark-ui')?'on':''}"><i></i></div></div>
        <div style="font-weight:800;font-size:13px;margin:12px 0 9px">Accent color</div>
        <div class="pro-colors">
          ${['#1769ff','#7c3aed','#059669','#ea580c','#db2777'].map(c=>`<button class="pro-color ${getComputedStyle(document.documentElement).getPropertyValue('--pro-primary').trim()===c?'sel':''}" data-pro-color="${c}" style="background:${c}"></button>`).join('')}
        </div>
      </div>
    </div>`;

  if(tab==='coins') {
    const allReq=Object.values(S.coinRequests||{}).filter(q=>q&&q.uid===S.uid);
    const allTx=S.isCaller ? Object.values(S.callerTransactions||{}) : Object.values(S.coinTransactions||{}).filter(x=>x.playerId===S.currentPlayerId);
    const income=allTx.filter(x=>x.type==='Income'&&x.status==='Approved').reduce((n,x)=>n+(+x.amount||0),0);
    const expense=allTx.filter(x=>x.type==='Expense'&&x.status==='Approved').reduce((n,x)=>n+(+x.amount||0),0);
    const pending=allReq.some(q=>q.status==='pending');
    const txClass=(x)=>x.status==='Approved'?(x.type==='Income'?'income':'expense'):x.status==='Cancelled'?'cancelled':'rejected';
    const txAmount=(x)=>x.type==='Income'?'+$'+(+x.amount||0):'-$'+(+x.amount||0);
    const txStatus=(x)=>String(x.status||'Pending').toLowerCase();
    if(S.isCaller){
      const pendingReq=Object.values(S.coinRequests||{}).filter(q=>q&&q.status==='pending');
      const reqHistory=Object.values(S.coinRequests||{}).filter(q=>q&&q.status!=='pending');
      const txItems=[...allTx.map(x=>({kind:'tx',x})),...reqHistory.filter(q=>q.status==='cancelled').map(q=>({kind:'cancel',q}))].sort((a,b)=>{
        const at=a.x?.decidedAt||a.x?.at||a.q?.decidedAt||a.q?.at||0;
        const bt=b.x?.decidedAt||b.x?.at||b.q?.decidedAt||b.q?.at||0;
        return (typeof bt==='number'?bt:0)-(typeof at==='number'?at:0);
      });
      return `<div class="pro-head"><div class="pro-brand">Coin Requests</div><div class="pro-room">${pendingReq.length} pending</div></div>
      <div class="pro-wrap">
        <div class="pro-card"><div class="pro-title">Player requests</div>
          ${pendingReq.length?`<div class="pro-list">${pendingReq.slice().reverse().map(q=>`<div class="pro-item"><span class="coin-pending-badge">PENDING</span><div style="margin-top:7px"><b>${esc(q.name||'Player')}</b><br><small>ID: ${esc(q.playerId||'—')} • ${q.kind==='deposit'?'Income request':'Expense request'} • $${q.amount||0}</small></div><div class="coin-request-actions"><button class="btn small" data-a="approvecoin" data-id="${esc(q.requestId)}">ፍቀድ</button><button class="btn danger small" data-a="rejectcoin" data-id="${esc(q.requestId)}">ውድቅ</button></div></div>`).join('')}</div>`:'<div class="pro-empty">Pending coin requests የሉም።</div>'}
        </div>
        <div class="pro-card"><div class="pro-title">Coin Transactions</div>
          ${txItems.length?`<div class="pro-list">${txItems.map(item=>{
            if(item.kind==='cancel'){const q=item.q;return `<div class="pro-item coin-tx cancelled"><div><b>${q.kind==='deposit'?'Income':'Expense'}</b> <span class="tx-amount">${q.kind==='deposit'?'+$':'-$'}${q.amount||0}</span></div><span class="tx-status cancelled">Cancelled</span><br><small>Player: ${esc(q.name||'Player')}</small></div>`;}
            const x=item.x; return `<div class="pro-item coin-tx ${txClass(x)}"><div><b>${esc(x.type||'Transaction')}</b> <span class="tx-amount">${txAmount(x)}</span></div><span class="tx-status ${txStatus(x)}">${esc(x.status||'Pending')}</span><br><small>Player: ${esc(x.playerName||'Player')}</small></div>`;
          }).join('')}</div>`:'<div class="pro-empty">No coin transactions yet.</div>'}
        </div>
      </div>`;
    }
    const merged=[];
    allReq.filter(q=>q.status==='pending').forEach(q=>merged.push({kind:'request',q}));
    allReq.filter(q=>q.status==='cancelled').forEach(q=>merged.push({kind:'cancel',q}));
    allTx.forEach(x=>merged.push({kind:'tx',x}));
    const items=merged.reverse();
    return `<div class="pro-head"><div class="pro-brand">Coins</div><div class="pro-room">$${balance}</div></div>
    <div class="pro-wrap">
      <div class="pro-card"><div class="pro-muted">Current balance</div><div class="pro-balance">$${balance}</div>
        <div id="proCoinForm"></div>
        <div class="pro-actions" style="margin-top:14px">
          <button class="pro-btn primary" data-pro-coin="deposit" ${pending?'disabled':''}>＋ ኮይን ገቢ አድርግ</button>
          <button class="pro-btn" data-pro-coin="withdraw" ${pending?'disabled':''}>− ኮይን ወጪ አድርግ</button>
        </div>
        ${pending?'<div class="pro-muted" style="margin-top:10px">⏳ የተላከ Coin Request ውሳኔ እየተጠበቀ ነው።</div>':''}
      </div>
      <div class="pro-card"><div class="pro-title">Summary</div>
        <div class="pro-row"><span class="pro-muted">Total Income</span><b>+$${income}</b></div>
        <div class="pro-row"><span class="pro-muted">Total Expense</span><b>-$${expense}</b></div>
        <div class="pro-row"><span class="pro-muted">Balance</span><b>$${balance}</b></div>
      </div>
      <div class="pro-card"><div class="pro-title">Coin Transactions</div>
        ${items.length?`<div class="pro-list">${items.map(item=>{
          if(item.kind==='request'){const q=item.q;return `<div class="pro-item coin-tx ${q.kind==='deposit'?'income':'expense'}"><span class="coin-pending-badge">PENDING</span><div style="margin-top:7px"><b>${q.kind==='deposit'?'Income':'Expense'}</b> <span class="tx-amount">${q.kind==='deposit'?'+$':'-$'}${q.amount||0}</span></div><small>You have a request waiting for Caller approval.</small><div style="margin-top:9px"><button class="btn danger small" data-a="cancelcoin" data-id="${esc(q.requestId)}">Cancel</button></div></div>`;}
          if(item.kind==='cancel'){const q=item.q;return `<div class="pro-item coin-tx cancelled"><div><b>${q.kind==='deposit'?'Income':'Expense'}</b> <span class="tx-amount">${q.kind==='deposit'?'+$':'-$'}${q.amount||0}</span></div><span class="tx-status cancelled">Cancelled</span><br><small>የራስህ ጥያቄ ተሰርዟል።</small></div>`;}
          const x=item.x;return `<div class="pro-item coin-tx ${txClass(x)}"><div><b>${esc(x.type||'Transaction')}</b> <span class="tx-amount">${txAmount(x)}</span></div><span class="tx-status ${txStatus(x)}">${esc(x.status||'Pending')}</span><br><small>${x.status==='Approved'?'By: Caller':'Request status'}</small></div>`;
        }).join('')}</div>`:'<div class="pro-empty">No coin transactions yet.</div>'}
      </div>
    </div>`;
  }

    if(tab==='history'){
    const h=proHistory();
    return `<div class="pro-head"><div class="pro-brand">History</div><div class="pro-room">${h.length} records</div></div>
    <div class="pro-wrap"><div class="pro-card">
      <div class="pro-title">Game history</div>
      ${h.length?`<div class="pro-list">${h.slice().reverse().map(x=>{
        const winners=(x.winners||[]).map(w=>'#'+esc(w.card)+' ('+esc(w.name||'Player')+')').join('፣ ');
        const result=x.noWinner?'No winner':('Winner: '+(winners||'—'));
        return `<div class="pro-item"><b>${esc(result)}</b><br><small>${esc(x.shapeName||x.shape||'Bingo')} • $${x.fee??0}</small></div>`;
      }).join('')}</div>`:'<div class="pro-empty">Game history will appear here.</div>'}
    </div></div>`;
  }

    if(tab==='players'){
    const ps=Object.values(S.players||{});
    return `<div class="pro-head"><div class="pro-brand">Players</div><div class="pro-room">${ps.length} players</div></div>
    <div class="pro-wrap"><div class="pro-card">
      <div class="pro-title">Players in room</div>
      ${ps.length?`<div class="pro-list">${ps.map(x=>`<div class="pro-item"><b>${esc(x.name||'Player')}</b><br><small>ID: ${esc(x.playerId||'—')}</small><div style="display:flex;justify-content:space-between;gap:8px;margin-top:7px"><span style="color:${x.online===false?'#d52b2b':'#159447'};font-weight:800">${x.online===false?'Offline':'Online'}</span><b>$${proCoins(x)}</b></div></div>`).join('')}</div>`:'<div class="pro-empty">No players yet.</div>'}
    </div></div>`;
  }

    // Game tab: close panel and reveal the original, fully functional game UI.
  return '';
}
function showProCoinForm(kind){
  if(S.isCaller)return;
  const box=$('proCoinForm');
  if(!box)return;
  const title=kind==='deposit'?'ኮይን ገቢ አድርግ':'ኮይን ወጪ አድርግ';
  box.innerHTML=`<div class="coin-request-box">
    <div class="coin-request-title">${title}</div>
    <p class="coin-request-help">የኮይን መጠን ያስገቡ</p>
    <input id="proCoinAmount" class="coin-amount-input" type="number" min="1" step="1" inputmode="numeric" placeholder="0" aria-label="Coin amount">
    <div class="coin-request-buttons">
      <button class="coin-submit-btn" data-pro-confirm="${kind}">Submit</button>
      <button class="coin-cancel-btn" data-pro-cancel-coin="1">Cancel</button>
    </div>
  </div>`;
  $('proCoinAmount')?.focus();
}

function showProTab(tab){
  proTab=tab;
  const panel=$('proPanel'), nav=$('proNav'), app=$('app');
  document.querySelectorAll('.pro-nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.proTab===tab));
  if(tab==='game'){
    panel.classList.remove('show'); app.classList.remove('ui-game-hidden');
  }else{
    panel.innerHTML=proPanelHtml(tab); panel.classList.add('show'); app.classList.add('ui-game-hidden');
  }
}
function updateProUI(){
  const ready = S.screen==='lobbyPlayer' || S.screen==='lobbyCaller' || S.screen==='playerGame' || S.screen==='callerGame' || S.screen==='joinWaiting';
  $('proNav')?.classList.toggle('show',ready);
  if(ready && $('proPanel')?.classList.contains('show')) $('proPanel').innerHTML=proPanelHtml(proTab);
  if(!ready){ $('proPanel')?.classList.remove('show'); $('app')?.classList.remove('ui-game-hidden'); }
}
function render(){
  document.body.dataset.role = S.isCaller ? 'caller' : 'player';
  const a = document.activeElement;
  const keep = a && a.dataset && a.dataset.f ? { f: a.dataset.f, s: a.selectionStart } : null;
  $('app').innerHTML = view();
  updateProUI();
  if (keep) {
    const el = document.querySelector('[data-f="' + keep.f + '"]');
    if (el) { try { el.focus(); if (keep.s != null) el.setSelectionRange(keep.s, keep.s); } catch (e) {} }
  }
}

document.addEventListener('click', (e)=>{
  const nav=e.target.closest('.pro-nav-btn');
  if(nav){ showProTab(nav.dataset.proTab); return; }
  const color=e.target.closest('[data-pro-color]');
  if(color){
    const c=color.dataset.proColor;
    document.documentElement.style.setProperty('--pro-primary',c);
    ls.set('bingo_ui_color',c);
    if(proTab==='profile') showProTab('profile');
    return;
  }
  if(e.target.closest('#proDark')){
    document.body.classList.toggle('dark-ui');
    ls.set('bingo_dark_ui',document.body.classList.contains('dark-ui')?'1':'0');
    if(proTab==='profile') showProTab('profile');
    return;
  }
  const coin=e.target.closest('[data-pro-coin]');
  if(coin){ if(!S.isCaller) showProCoinForm(coin.dataset.proCoin); return; }
  const cancelCoin=e.target.closest('[data-pro-cancel-coin]');
  if(cancelCoin){ const box=$('proCoinForm'); if(box)box.innerHTML=''; return; }
  const confirmCoin=e.target.closest('[data-pro-confirm]');
  if(confirmCoin){
    const input=$('proCoinAmount');
    const n=Math.floor(Number(input?.value));
    if(!Number.isFinite(n)||n<=0){ toast('የኮይኑን ትክክለኛ መጠን ያስገቡ።'); return; }
    const kind=confirmCoin.dataset.proConfirm;
    requestCoin(kind,n).then(()=>{
      const box=$('proCoinForm');
      if(box)box.innerHTML='';
      showProTab('coins');
    }).catch(()=>{});
  }
});
document.addEventListener('click',(e)=>{
  const t=e.target.closest('#toast');
  if(t && t.dataset.openCoins==='1' && S.isCaller){ t.classList.remove('show'); t.dataset.openCoins=''; showProTab('coins'); }
});
window.addEventListener('online',()=>{ const x=$('proConnection'); if(x)x.textContent='Online'; });
window.addEventListener('offline',()=>{ const x=$('proConnection'); if(x)x.textContent='Offline'; });
if(ls.get('bingo_dark_ui')==='1') document.body.classList.add('dark-ui');
if(ls.get('bingo_ui_color')) document.documentElement.style.setProperty('--pro-primary',ls.get('bingo_ui_color'));

render();
boot();
setInterval(() => {
  if (S.round && S.round.status === 'claim') {
    document.querySelectorAll('.cdv').forEach((el) => { el.textContent = cdLeft(); });
  }
}, 250)
  </script>
</body>
</html>
